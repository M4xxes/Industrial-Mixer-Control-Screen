version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - mixer-db:/app/server/data
    environment:
      - NODE_ENV=production
      - SQLITE_DB_PATH=/app/server/data/database.sqlite

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mixer-db:
